<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>AudioViz Component Example</title>
    <script type="module" src="dist/audioviz-webcomponent.js"></script>
    <!--
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ngyewch/audioviz-webcomponent@0.1.0/dist/audioviz-webcomponent.js"></script>
    -->
    <style>
        .audioviz {
            width: 100%;
            height: 320px;
        }
    </style>
</head>
<body>
<div>
    <input type="range" min="-150" max="0" value="-50" id="minDb">
</div>
<div>
    <input type="range" min="-150" max="0" value="0" id="maxDb">
</div>
<div>
    <audio-viz id="test" class="audioviz" minDb="-150" maxDb="-50"></audio-viz>
</div>
<script>
    const minDbEl = document.querySelector('#minDb');
    const maxDbEl = document.querySelector('#maxDb');
    const testEl = document.querySelector('#test');
    minDbEl.addEventListener('change', (e) => {
        testEl.minDb = minDbEl.value;
    });
    maxDbEl.addEventListener('change', (e) => {
        testEl.maxDb = maxDbEl.value;
    });
</script>
</body>
</html>
